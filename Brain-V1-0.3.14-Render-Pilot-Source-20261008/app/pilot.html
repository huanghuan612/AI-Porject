<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>探索一下 · 受邀内测</title><link rel="stylesheet" href="/pilot.css"><main><button id="shutdown" hidden>关闭本机服务</button><p class="tag">受邀内测 · 免费</p><h1>从一件真实的小事开始</h1><p>不用想好答案，也可以说“不知道”。这里的发现只用于探索，不是专业或职业适配结论。</p><section id="login"><label>邀请码<input id="code" autocomplete="off"></label><button id="enter">进入</button></section><section id="workspace" hidden><p id="budget"></p><p id="notice">回答将发送给阿里云百炼进行AI处理，并由项目负责人查看内测记录。请勿填写姓名、学校、联系方式或其他人的隐私。可以随时停止；如需删除记录，请联系邀请你的人。</p><label><input type="checkbox" id="consent">我了解以上说明，并愿意参加。</label><button id="start">开始探索</button><button id="preview">查看首题界面（不调用AI）</button><h2 id="question"></h2><div id="choices" role="radiogroup" aria-labelledby="question" hidden></div><textarea id="answer" rows="3" placeholder="说说你真实做过的事和感受"></textarea><button id="send">提交回答</button><button id="stop">停止探索</button><div id="result"></div><section id="micro"><button id="offer">看看一项可选小任务</button><p id="task"></p><button id="microStart">我愿意开始任务</button><button id="microSubmit">提交任务回答</button><button id="microFeedback">提交一次可选反馈</button><button id="microExit">退出任务</button></section><button id="export">下载我的回答与发现</button></section><p id="message" role="status" aria-live="polite"></p></main><script src="/pilot.js"></script></html>
